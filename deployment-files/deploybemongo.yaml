apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: music-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        fsGroup: 1000710000
      containers:
      - name: mongodb
        image: quay.io/rhn_support_kquinn/be-mongo-db-artist-new:latest
        ports:
        - containerPort: 27017
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
          readOnly: false
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 1000710000
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
