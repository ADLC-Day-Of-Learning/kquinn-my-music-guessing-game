apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: music-game
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: registry.access.redhat.com/ubi9/nginx-124
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: cache-volume
          mountPath: /var/cache/nginx
        env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config  # Reference the existing ConfigMap
              key: BACKEND_URL
        securityContext:
          allowPrivilegeEscalation: false
        command: ["/bin/sh"]
        args: ["-c", 
        "envsubst '${BACKEND_URL}' < /usr/share/nginx/html/index.html.template > /usr/share/nginx/html/index.html && \
         envsubst '${BACKEND_URL}' < /usr/share/nginx/html/script.js.template > /usr/share/nginx/html/script.js && \
         envsubst '${BACKEND_URL}' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf && \
         nginx -c /tmp/nginx.conf -g 'daemon off;'"]
      volumes:
      - name: cache-volume
        emptyDir: {}
